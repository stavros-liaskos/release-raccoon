---
openapi: 3.1.0
tags:
  - name: RaccoonUserResource
  - name: ReleaseResource
components:
  schemas:
    Artist:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createDate:
          $ref: '#/components/schemas/LocalDateTime'
        name:
          type: string
        lastfmUri:
          type: string
        spotifyUri:
          type: string
        musicbrainzId:
          type: string
        spotifyUriId:
          type: string
    ArtistDto:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        lastfmUri:
          type: string
        spotifyUri:
          type: string
        musicbrainzId:
          type: string
    ArtistSearchResponse:
      type: object
      properties:
        count:
          type: integer
          format: int32
        artists:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultArtistDto'
    FollowedArtistsResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ArtistDto'
    LocalDate:
      type: string
      format: date
      examples:
        - 2022-03-10
    LocalDateTime:
      type: string
      format: date-time
      examples:
        - 2022-03-10T12:15:50
    RaccoonUser:
      type: object
      required:
        - email
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        username:
          type: string
        lastfmUsername:
          type: string
        spotifyEnabled:
          type: boolean
        lastNotified:
          $ref: '#/components/schemas/LocalDate'
        createDate:
          $ref: '#/components/schemas/LocalDateTime'
        modifyDate:
          $ref: '#/components/schemas/LocalDateTime'
        lastSpotifyScrape:
          $ref: '#/components/schemas/LocalDateTime'
        lastLastFmScrape:
          $ref: '#/components/schemas/LocalDateTime'
    RegisterUserRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
        lastfmUsername:
          type: string
        spotifyEnabled:
          type: boolean
    Release:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
        spotifyUri:
          type: string
        musicbrainzId:
          type: string
        releasedOn:
          $ref: '#/components/schemas/LocalDate'
    ReleaseScrapeResponse:
      type: object
      properties:
        scrape:
          $ref: '#/components/schemas/Scrape'
    Scrape:
      type: object
      properties:
        id:
          type: integer
          format: int64
        createDate:
          $ref: '#/components/schemas/LocalDateTime'
        modifyDate:
          $ref: '#/components/schemas/LocalDateTime'
        completeDate:
          $ref: '#/components/schemas/LocalDateTime'
        releasesFromSpotify:
          type: integer
          format: int64
        releasesFromMusicbrainz:
          type: integer
          format: int64
        releaseCount:
          type: integer
          format: int32
        usersNotified:
          type: integer
          format: int64
        relevantReleases:
          type: integer
          format: int64
        isComplete:
          type: boolean
        releases:
          type: array
          items:
            $ref: '#/components/schemas/Release'
    SearchResultArtistDto:
      type: object
      required:
        - name
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        lastfmUri:
          type: string
        spotifyUri:
          type: string
        musicbrainzId:
          type: string
        followedByUser:
          type: boolean
    UserArtist:
      type: object
      properties:
        weight:
          type: number
          format: float
        hasNewRelease:
          type: boolean
        user:
          $ref: '#/components/schemas/RaccoonUser'
          type: object
          writeOnly: true
        artist:
          $ref: '#/components/schemas/Artist'
          type: object
          writeOnly: true
    UserSettings:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/RaccoonUser'
        notifyIntervalDays:
          type: integer
          format: int32
        unsubscribed:
          type: boolean
    UserSettingsDto:
      type: object
      properties:
        notifyIntervalDays:
          type: integer
          format: int32
        unsubscribed:
          type: boolean
  securitySchemes:
    SecurityScheme:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8181/realms/RaccoonRealm/.well-known/openid-configuration
      description: Authentication
paths:
  /:
    get:
      responses:
        '200':
          description: OK
      summary: Index
      tags:
        - Index Resource
  /artist/search:
    get:
      parameters:
        - name: pattern
          in: query
          schema:
            type: string
        - name: size
          in: query
          schema:
            type: integer
            format: int32
          required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistSearchResponse'
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Search Artists
      tags:
        - Artist Search Resource
      security:
        - SecurityScheme: []
  /artists:
    get:
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            exclusiveMinimum: 0
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            exclusiveMinimum: 0
            format: int32
            default: 10
            maximum: 100
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Get All
      tags:
        - Artist Resource
      security:
        - SecurityScheme: []
  /artists/recommended:
    get:
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            exclusiveMinimum: 0
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            exclusiveMinimum: 0
            format: int32
            default: 10
            maximum: 100
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowedArtistsResponse'
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Get Followed
      tags:
        - Artist Resource
      security:
        - SecurityScheme: []
  /me:
    get:
      parameters:
        - name: redirectUrl
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Registration Callback
      tags:
        - User Profile Resource
      security:
        - SecurityScheme: []
  /me/enable-services:
    get:
      parameters:
        - name: enableSpotify
          in: query
          schema:
            type: boolean
          required: false
        - name: lastfmUsername
          in: query
          schema:
            type: string
          required: false
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Enable Taste Sources
      tags:
        - User Profile Resource
      security:
        - SecurityScheme: []
  /me/follow:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchResultArtistDto'
        required: true
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
        '400':
          description: Bad Request
      summary: Follow Artist
      tags:
        - User Profile Resource
      security:
        - SecurityScheme: []
  /me/followed-artists:
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowedArtistsResponse'
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Get Followed Artists
      tags:
        - User Profile Resource
      security:
        - SecurityScheme: []
  /me/settings:
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
        required: true
      responses:
        '201':
          description: Created
        '400':
          description: Bad Request
      summary: Set User Settings
      tags:
        - User Settings Resource
    get:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettingsDto'
      summary: Get User Settings
      tags:
        - User Settings Resource
  /me/unfollow/{artistId}:
    delete:
      parameters:
        - name: artistId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Unfollow Artist
      tags:
        - User Profile Resource
      security:
        - SecurityScheme: []
  /notify-users:
    get:
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: boolean
      summary: Notify Users
      tags:
        - Notifying Resource
  /raccoon-user:
    get:
      tags:
        - RaccoonUserResource
      parameters:
        - name: email
          in: query
          schema:
            type: string
        - name: id
          in: query
          schema:
            type: integer
            format: int64
        - name: lastfmUsername
          in: query
          schema:
            type: string
        - name: namedQuery
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
        - name: spotifyEnabled
          in: query
          schema:
            type: boolean
        - name: username
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RaccoonUser'
      summary: List
    post:
      tags:
        - RaccoonUserResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaccoonUser'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaccoonUser'
        '400':
          description: Bad Request
      summary: Add
  /raccoon-user/count:
    get:
      tags:
        - RaccoonUserResource
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
      summary: Count
  /raccoon-user/{id}:
    put:
      tags:
        - RaccoonUserResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaccoonUser'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaccoonUser'
        '400':
          description: Bad Request
      summary: Update
    get:
      tags:
        - RaccoonUserResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RaccoonUser'
      summary: Get
    delete:
      tags:
        - RaccoonUserResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204': {}
      summary: Delete
  /release:
    get:
      tags:
        - ReleaseResource
      parameters:
        - name: id
          in: query
          schema:
            type: integer
            format: int64
        - name: musicbrainzId
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: namedQuery
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            format: int32
            default: 20
        - name: sort
          in: query
          schema:
            type: array
            items:
              type: string
        - name: spotifyUri
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Release'
      summary: List
    post:
      tags:
        - ReleaseResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Release'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          description: Bad Request
      summary: Add
  /release-scrape:
    put:
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseScrapeResponse'
      summary: Scrape Releases
      tags:
        - Release Scrape Resource
  /release/count:
    get:
      tags:
        - ReleaseResource
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                format: int64
      summary: Count
  /release/{id}:
    put:
      tags:
        - ReleaseResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Release'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
        '400':
          description: Bad Request
      summary: Update
    get:
      tags:
        - ReleaseResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Release'
      summary: Get
    delete:
      tags:
        - ReleaseResource
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204': {}
      summary: Delete
  /scrape-taste/lastfm:
    parameters:
      - name: email
        in: query
        schema:
          type: string
    get:
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserArtist'
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Scrape Lastfm Taste
      tags:
        - Taste Scraping Resource
      security:
        - SecurityScheme: []
  /scrape-taste/spotify:
    parameters:
      - name: email
        in: query
        schema:
          type: string
    get:
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Scrape Spotify Taste
      tags:
        - Taste Scraping Resource
      security:
        - SecurityScheme: []
  /spotify-auth-callback:
    get:
      parameters:
        - name: code
          in: query
          schema:
            type: string
        - name: error
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
      summary: Complete Auth
      tags:
        - Spotify Auth Resource
    post:
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterUserRequest'
        required: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      summary: Authorize Spotify
      tags:
        - Spotify Auth Resource
  /spotify-auth-callback/user-top-artists:
    get:
      parameters:
        - name: userId
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
      summary: Get User Top Artists
      tags:
        - Spotify Auth Resource
  /test-ui/test-ui:
    get:
      responses:
        '200':
          description: OK
        '401':
          description: Not Authorized
        '403':
          description: Not Allowed
      summary: Get Recommended
      tags:
        - Test Resource
      security:
        - SecurityScheme: []
info:
  title: release-raccoon-app API
  version: 0.4.8-SNAPSHOT
